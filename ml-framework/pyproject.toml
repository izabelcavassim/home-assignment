[tool.poetry]
name = "ml-framework"
version = "0.1.0"
description = "A scalable ML framework for analyzing large datasets with mixed data types"
authors = ["Izabel <izabel@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["machine-learning", "data-science", "streaming-analysis", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "src"}]

[tool.poetry.urls]
Homepage = "https://github.com/example/ml-framework"
Documentation = "https://ml-framework.readthedocs.io"
Repository = "https://github.com/example/ml-framework.git"
Issues = "https://github.com/example/ml-framework/issues"

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
numpy = "^1.24.0"
polars = "^0.19.0"
scikit-learn = "^1.3.0"
pydantic = "^2.0.0"
pyyaml = "^6.0"
optuna = "^3.0.0"
scikit-optimize = "^0.9.0"
tqdm = "^4.65.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.14.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0.0"
sphinx-rtd-theme = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
