# Streaming Growth Analysis Configuration
#
# Configuration file for analyzing drivers of artist streaming growth
# Can be used with --config flag or as reference for parameters

# Data Configuration
data:
  data_dir: "data/artist_performance"  # Directory with artist performance CSVs
  artist_sample_size: 100               # Number of artists to sample
  min_weeks_per_artist: 20              # Minimum weeks of data required
  random_state: 42                      # Random seed for reproducibility

# Feature Engineering Configuration
features:
  target_col: "number_of_streams"       # Target column for growth prediction
  lags: [1, 2, 4]                       # Lag periods in weeks
  rolling_windows: [4, 8]               # Rolling window sizes in weeks
  min_periods_pct: 0.5                  # Min fraction of periods for rolling stats

# Model Configuration
model:
  model_type: "linear_regression"       # linear_regression, random_forest, gradient_boosting
  cv_folds: 5                           # Number of time-series CV folds
  test_size: 0.2                        # Fraction for test set (temporal split)
  
  # Model-specific parameters
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 5
    random_state: 42
  
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42

# Output Configuration
output:
  output_dir: "results/streaming_growth"
  save_predictions: true
  save_feature_importance: true
  save_model: true

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Analysis Notes
# 
# Key Assumptions:
# - All features are lagged by at least 1 week to prevent temporal leakage
# - Train/test split is temporal (not random) to respect time-series nature
# - Artists sampled by total streaming volume (top N artists)
# - Missing values handled by dropping rows (assumes data quality issues)
#
# Temporal Leakage Prevention:
# - Target is week t streaming growth
# - Features are from week t-1 and earlier
# - No future information used in feature engineering
#
# Data Scope:
# - Weekly granularity over ~5 years
# - Focus on top artists with consistent data
# - Streaming data is global, ticket sales primarily U.S.
