# ML Framework Configuration Example
# Copy this file and customize for your use case

# Data Loading and Preprocessing Configuration
data:
  # Fraction of data to use for testing
  test_size: 0.2
  
  # Random seed for reproducibility
  random_state: 42
  
  # Batch size for data loading
  batch_size: 32
  
  # Number of workers for parallel data loading
  num_workers: 4
  
  # Whether to shuffle data during loading
  shuffle: true
  
  # Whether to normalize features
  normalize: true
  
  # Strategy for handling missing values
  # Options: mean, median, drop, forward_fill, backward_fill
  handle_missing: mean

# Model Configuration
model:
  # Model type to train
  # Options: logistic_regression, random_forest, svm, gradient_boosting
  model_type: random_forest
  
  # Random seed for reproducibility
  random_state: 42
  
  # Number of jobs for parallel processing (-1 = use all cores)
  n_jobs: -1
  
  # Verbosity level (0, 1, 2)
  verbose: 1

# Training Configuration
training:
  # Number of training epochs (for neural networks)
  epochs: 100
  
  # Learning rate (for neural networks)
  learning_rate: 0.001
  
  # Batch size for training
  batch_size: 32
  
  # Fraction of training data to use for validation
  validation_split: 0.2
  
  # Number of epochs to wait before early stopping
  early_stopping_patience: 10
  
  # Metric to monitor for early stopping
  early_stopping_metric: loss
  
  # Optimizer for neural networks
  # Options: adam, sgd, rmsprop
  optimizer: adam
  
  # Loss function for neural networks
  # Options: cross_entropy, mse, mae
  loss_function: cross_entropy

# Evaluation Configuration
evaluation:
  # Metrics to compute
  metrics:
    - accuracy
    - precision
    - recall
    - f1
  
  # Number of cross-validation folds
  cv_folds: 5
  
  # Cross-validation strategy
  # Options: stratified, kfold, timeseries
  cv_strategy: stratified

# Experiment Configuration
experiment:
  # Name of the experiment
  name: default_experiment
  
  # Description of the experiment
  description: "ML Framework experiment"
  
  # Whether to save trained model
  save_model: true
  
  # Whether to save predictions
  save_predictions: true
  
  # Whether to save metrics
  save_metrics: true
  
  # Output directory for results
  output_dir: results
